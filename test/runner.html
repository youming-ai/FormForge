<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>runner</title>
<style>
  body { font: 13px/1.7 monospace; padding: 16px; }
  .pass { color: #059669; }
  .fail { color: #dc2626; font-weight: bold; }
  .section { margin-top: 14px; font-weight: bold; }
  #fixture { position: absolute; left: -99999px; top: 0; } /* 移出屏幕但保留渲染：visible() 用 offsetParent 判断，display:none 会让快照为空 */
</style>
</head>
<body>

<div id="summary">running…</div>
<div id="results"></div>
<script type="application/json" id="results-json">{"status":"running"}</script>

<!-- ============ 以下为被测 fixture DOM（隐藏） ============ -->
<div id="fixture">
<header>
  <!-- 表单外搜索框：不应进快照（pickScope 选控件最多的 form A） -->
  <input type="text" placeholder="サイト内検索" aria-label="サイト内検索">
</header>

<form id="main-form">
  <div class="field">
    <label for="f-name">氏名</label>
    <input id="f-name" name="name" type="text" required>
  </div>
  <div class="field">
    <label>メールアドレス<input id="f-email" name="email" type="email"></label>
  </div>
  <div class="field">
    <input id="f-tel" name="tel" type="tel" placeholder="電話番号" aria-label="電話番号">
  </div>
  <div class="field">
    <label for="f-birth">生年月日</label>
    <input id="f-birth" name="birth" type="date" required>
  </div>
  <div class="field">
    <label for="f-city">都道府県</label>
    <select id="f-city" name="city" required>
      <option value="">選択してください</option>
      <option value="tokyo">東京</option>
      <option value="osaka">大阪</option>
      <option value="fukuoka">福岡</option>
      <option value="sapporo">札幌</option>
    </select>
  </div>
  <fieldset id="f-pay-group">
    <legend>支払い方法</legend>
    <label><input type="radio" name="pay" value="card" checked>カード</label>
    <label><input type="radio" name="pay" value="bank">銀行振込</label>
    <label><input type="radio" name="pay" value="cod">代金引換</label>
  </fieldset>
  <div class="field" id="f-opt-group">
    <label><input type="checkbox" name="opt1" checked>メール受け取り</label>
    <label><input type="checkbox" name="opt2">DM受け取り</label>
  </div>
  <div class="field">
    <label for="f-bio">自己紹介</label>
    <textarea id="f-bio" name="bio"></textarea>
  </div>
  <div class="field">
    <label for="f-file">履歴書</label>
    <input id="f-file" name="file" type="file" accept="image/*">
  </div>
  <div class="field">
    <label for="f-qty">数量</label>
    <input id="f-qty" name="qty" type="number">
  </div>
  <div class="field">
    <label for="f-pass">パスワード</label>
    <input id="f-pass" name="pass" type="password">
  </div>
  <input type="hidden" name="csrf" value="x" aria-label="隠しフィールド">
  <div class="field">
    <label for="f-dis">無効項目</label>
    <input id="f-dis" name="dis" type="text" disabled>
  </div>
</form>

<form id="side-form">
  <label for="f-side">サイド入力</label>
  <input id="f-side" type="text">
</form>
</div>

<script>
// —— chrome API stub（content 隔离世界里真实存在；页面环境模拟）——
window.chrome = {
  storage: { local: { get: async () => ({ agentSettings: null }), set: async () => {} } },
  runtime: { onMessage: { addListener: () => {} }, sendMessage: async () => ({}) },
}
</script>
<!-- 扩展真实模块（与 manifest 注入同序：utils → snapshot → dom-tools） -->
<script src="../src/content/utils.js"></script>
<script src="../src/content/snapshot.js"></script>
<script src="../src/content/dom-tools.js"></script>

<script>
(async function () {
  const cases = []
  const out = []
  const pass = n => { out.push(`<div class="pass">✓ ${n}</div>`); cases.push({ ok: true, name: n }) }
  const fail = (n, d) => { out.push(`<div class="fail">✗ ${n} :: ${d}</div>`); cases.push({ ok: false, name: n, detail: d }) }
  const assert = (c, n, d = '') => c ? pass(n) : fail(n, d)
  const eq = (a, b, n) => assert(a === b, n, `got=${JSON.stringify(a)} want=${JSON.stringify(b)}`)
  const findF = (snap, l) => snap.fields.find(f => (f.label || '') === l)
  const findInc = (snap, l) => snap.fields.find(f => (f.label || '').includes(l))

  // ===== A. 快照结构 =====
  const snap = buildSnapshot()
  out.push('<div class="section">A. buildSnapshot 结构</div>')

  eq(snap.isConfirmStep, false, 'A1 有可编辑控件 → 非确认页')
  eq(snap.fields.length, 11, 'A2 字段数=11（hidden/disabled 已跳过）')

  const nameF = findF(snap, '氏名')
  assert(nameF && nameF.kind === 'text', 'A3 text 识别（label-for）', JSON.stringify(nameF && nameF.label))
  eq(nameF && nameF.required, true, 'A3b required 属性识别')

  const emailF = findInc(snap, 'メールアドレス')
  assert(emailF && emailF.kind === 'text', 'A4 label 包裹 email → text', JSON.stringify(emailF && emailF.label))

  const telF = findInc(snap, '電話番号')
  assert(telF, 'A5 placeholder/aria-label 兜底出标签', JSON.stringify(telF && telF.label))

  const birthF = findF(snap, '生年月日')
  assert(birthF && birthF.kind === 'date', 'A5b 原生 date 识别')

  const cityF = findF(snap, '都道府県')
  assert(cityF && cityF.kind === 'select', 'A6 原生 select 识别')
  eq(cityF && Array.isArray(cityF.options) && cityF.options.length, 4, 'A6b options 直读且滤掉空值占位项')

  const payF = findF(snap, '支払い方法')
  assert(payF && payF.kind === 'radio', 'A7 radio 组识别（fieldset，label=legend）', JSON.stringify(payF && payF.label))
  eq(payF && payF.filled, true, 'A7b radio 预选 → filled（按设计不再给 options，省 token）')
  eq(payF && payF.value, 'カード', 'A7c 预选值回读')

  const cbF = snap.fields.find(f => f.kind === 'checkbox')
  assert(cbF && cbF.options && cbF.options.length === 2, 'A8 checkbox div 组聚合为 1 字段+checked 标记', JSON.stringify(cbF && cbF.options))
  assert(cbF.options[0].checked === true && cbF.options[1].checked === false, 'A8b checked 标记正确')

  const bioF = findF(snap, '自己紹介')
  assert(bioF && bioF.kind === 'textarea', 'A8b textarea 识别')

  const fileF = findF(snap, '履歴書')
  assert(fileF && fileF.kind === 'upload', 'A8c 原生 file 识别为 upload')

  assert(!snap.fields.some(f => (f.label || '').includes('隠し')), 'A9 hidden 跳过')
  assert(!snap.fields.some(f => (f.label || '').includes('無効')), 'A10 disabled 跳过')
  assert(!snap.fields.some(f => (f.label || '').includes('サイド')), 'A11 pickScope 选 Form A（side-form 不在）')
  assert(!snap.fields.some(f => (f.label || '').includes('サイト内検索')), 'A12 表单外搜索框跳过')

  const labels = snap.fields.map(f => f.label || '')
  const idx = l => labels.findIndex(x => x.includes(l))
  const seq = ['氏名', 'メール', '電話', '生年月日', '都道府県', '支払い方法', '自己紹介', '履歴書', '数量', 'パスワード']
  let seqOk = true
  for (let i = 1; i < seq.length; i++) if (idx(seq[i - 1]) >= idx(seq[i])) seqOk = false
  assert(seqOk, 'A13 字段严格按文档序排列', JSON.stringify(labels))

  // ===== B. 执行层 =====
  out.push('<div class="section">B. execTool 执行（真实 DOM 生效）</div>')
  const r1 = await execTool('fill_text', { ref: nameF.ref, value: 'テスト山田太郎' })
  eq(r1.ok, true, 'B1 fill_text ok')
  eq(document.getElementById('f-name').value, 'テスト山田太郎', 'B1b input.value 已写入')

  const r2 = await execTool('choose_option', { ref: cityF.ref, option: 'first' })
  eq(r2.ok, true, 'B2 select first ok')
  eq(document.getElementById('f-city').value, 'tokyo', 'B2b first=東京（跳过占位项）')

  const r3 = await execTool('choose_option', { ref: cityF.ref, option: '福岡' })
  eq(r3.ok, true, 'B3 select 按文本选 ok')
  eq(document.getElementById('f-city').value, 'fukuoka', 'B3b 已选福岡')

  const r3b = await execTool('choose_option', { ref: cityF.ref, option: '存在しない選択肢' })
  eq(r3b.ok, false, 'B4 不存在选项 → ok=false')

  const r5 = await execTool('choose_option', { ref: payF.ref, option: '銀行振込' })
  eq(r5.ok, true, 'B5 radio 按文本选 ok')
  eq(document.querySelector('input[name="pay"]:checked').value, 'bank', 'B5b bank 选中且互斥')

  const r6 = await execTool('choose_option', { ref: payF.ref, option: 'random' })
  eq(r6.ok, true, 'B6 radio random 兼容路径 ok')

  const r7 = await execTool('choose_option', { ref: cbF.ref, option: 'check' })
  eq(r7.ok, true, 'B7 checkbox 全勾 ok')
  eq([...document.querySelectorAll('#f-opt-group input[type=checkbox]')].every(i => i.checked), true, 'B7b 两个都已勾')

  const r8 = await execTool('choose_option', { ref: cbF.ref, option: 'uncheck' })
  eq(r8.ok, true, 'B8 uncheck ok')
  eq([...document.querySelectorAll('#f-opt-group input[type=checkbox]')].some(i => i.checked), false, 'B8b 全部取消')

  const r9 = await execTool('set_date', { ref: birthF.ref, year: 1990, month: 4, day: 5 })
  eq(r9.ok, true, 'B9 原生 date 设值 ok')
  eq(document.getElementById('f-birth').value, '1990-04-05', 'B9b value=1990-04-05')

  const r10 = await execTool('read_options', { ref: cityF.ref })
  eq(r10.ok, true, 'B10 read_options ok')
  eq(r10.result && r10.result.count, 4, 'B10b count=4（占位项已滤）')

  const r11 = await execTool('upload_file', { ref: fileF.ref })
  eq(r11.ok, true, 'B11 原生 file 塞入 ok', JSON.stringify(r11))
  eq(document.getElementById('f-file').files.length, 1, 'B11b input.files 有文件')

  const r12 = await execTool('fill_text', { ref: bioF.ref, value: 'よろしくお願いします。' })
  eq(r12.ok, true, 'B12 textarea fill ok')
  eq(document.getElementById('f-bio').value, 'よろしくお願いします。', 'B12b textarea 值已写入')

  // ===== D. P1 修复验证 =====
  out.push('<div class="section">D. P1 修复验证</div>')

  // D1: position:fixed 的弹窗表单可见（offsetParent 盲区修复）
  const modal = document.createElement('div')
  modal.style.cssText = 'position:fixed;left:20px;top:20px;z-index:99999;background:#fff;padding:10px;'
  modal.innerHTML = '<form id="fixed-form"><label for="f-modal">モーダル入力</label><input id="f-modal" type="text" required><button type="button">次へ</button></form>'
  document.body.appendChild(modal)
  const fixedInput = document.getElementById('f-modal')
  eq(visible(fixedInput), true, 'D1 fixed 定位元素 visible()（修复前 offsetParent=null 误判不可见）')
  modal.remove() // D1b 在 C 区后用 iframe（fixtures-fixed.html）验证——scope 选「控件最多的 form」，本页 main-form 优先是设计行为

  // D2: detached ref → getRef 返回 null（明确报错而非静默写孤儿节点）
  // 手动把 REFS 里一个字段的 item detach 后再 getRef
  const snap2 = buildSnapshot() // 重建 REFS
  const anyField = snap2.fields[0]
  if (anyField) {
    const origItem = getRef(anyField.ref).item
    const origParent = origItem.parentElement
    const detachedHolder = document.createElement('div')
    detachedHolder.appendChild(origItem) // 从原位移除（detach）
    const afterDetach = getRef(anyField.ref)
    eq(afterDetach, null, 'D2 detached 节点的 ref 返回 null（修复前会静默返回孤儿节点）')
    const rOrph = await execTool('fill_text', { ref: anyField.ref, value: 'x' })
    eq(rOrph.ok, false, 'D2b 对失效 ref 的 fill_text 明确失败')
    assert(/失效|重新 get_form/.test(rOrph.result || ''), 'D2c 提示重新 get_form')
    origParent.appendChild(origItem) // 还原
  } else {
    fail('D2 无字段可测')
  }

  // ===== C. 确认页/中间页（iframe 加载同源 fixture，各自含模块）=====
  out.push('<div class="section">C. 确认页判定与拦截</div>')
  // 等 iframe 内 eval 异步任务写入 window.__r（轮询，消除虚拟时间下的定时竞态）
  const waitR = async (w) => {
    const t0 = Date.now()
    while (w.__r === undefined && Date.now() - t0 < 8000) await new Promise(r => setTimeout(r, 100))
    return w.__r
  }
  const probe = async (page, fn) => {
    const ifr = document.createElement('iframe')
    ifr.src = page
    document.body.appendChild(ifr)
    await new Promise(res => { ifr.onload = res; setTimeout(res, 2500) })
    const w = ifr.contentWindow
    const r = await fn(w)
    ifr.remove()
    return r
  }

  // iframe 里模块用 const 声明（不挂 window），须用 w.eval 在其环境求值
  const c1 = await probe('fixtures-confirm.html', async w => {
    w.eval('(async () => { const v = { conf: isConfirm(), blocked: await execTool("click_button", { target: "next" }) }; window.__r = JSON.stringify(v) })()')
    return JSON.parse(await waitR(w))
  })
  eq(c1.conf, true, 'C1 确认页判定（无可编辑控件+申込む）')
  eq(c1.blocked.ok, false, 'C2 确认页 click_button 被拦截')
  assert(/finish/.test(c1.blocked.result || ''), 'C2b 提示改用 finish')

  const c2 = await probe('fixtures-step.html', async w => {
    w.eval('(async () => { const v = { conf: isConfirm(), res: await execTool("click_button", { target: "next" }) }; window.__r = JSON.stringify(v) })()')
    const r = JSON.parse(await waitR(w))
    return { conf: r.conf, ok: r.res.ok, result: r.res.result }
  })
  eq(c2.conf, false, 'C3 中间步骤页非确认')
  eq(c2.ok, true, 'C4 中间步骤「次へ」放行')

  // D1b: fixed 弹窗表单页（页面唯一 form）——字段进快照 + 提交词拦截
  const c3 = await probe('fixtures-fixed.html', async w => {
    w.eval('(async () => { const snap = buildSnapshot(); const email = snap.fields.find(f => (f.label||"").includes("メールアドレス")); const pass = snap.fields.find(f => (f.label||"").includes("パスワード")); const blocked = await execTool("click_button", { target: "next" }); window.__r = JSON.stringify({ emailOk: !!(email && email.kind === "text" && email.required), passOk: !!(pass && pass.kind === "text"), blocked }) })()')
    return JSON.parse(await waitR(w))
  })
  eq(c3.emailOk, true, 'D1b fixed 弹窗字段进快照（email required）')
  eq(c3.passOk, true, 'D1b fixed 弹窗字段进快照（password）')
  eq(c3.blocked.ok, false, 'D1b 「登録する」按钮被词表拦截')

  // ===== E. 导航按钮匹配增强（AntD 次 へ / 外部按钮 / 确认画面へ / 禁用检测）=====
  out.push('<div class="section">E. 导航按钮与 次へ 匹配</div>')
  // E1: 表单外 .ant-steps-action 中的「次 へ」（含空格）正常匹配
  const stepContainer = document.createElement('div')
  stepContainer.innerHTML = `
    <div class="ant-steps-action">
      <button type="button" class="ant-btn ant-btn-primary" id="btn-next-space"><span>次 へ</span></button>
    </div>`
  document.body.appendChild(stepContainer)
  const nav1 = findNavButton('next')
  assert(nav1.btn && nav1.btn.id === 'btn-next-space', 'E1 识别表单外部且含空格的「次 へ」按钮')
  stepContainer.remove()

  // E2: 「確認画面へ」正常作为 next 候选且得分高
  const confirmBtnHolder = document.createElement('div')
  confirmBtnHolder.innerHTML = '<button type="button" class="ant-btn ant-btn-primary" id="btn-confirm-screen">確認画面へ</button>'
  document.body.appendChild(confirmBtnHolder)
  const nav2 = findNavButton('next')
  assert(nav2.btn && nav2.btn.id === 'btn-confirm-screen', 'E2 识别「確認画面へ」为下一步导航')
  confirmBtnHolder.remove()

  // E3: 次へ 按钮处于 disabled 状态时，click_button 返回明确提示而非误判为单页
  const disBtnHolder = document.createElement('div')
  disBtnHolder.innerHTML = '<button type="button" class="ant-btn ant-btn-disabled" disabled id="btn-next-dis">次へ</button>'
  document.body.appendChild(disBtnHolder)
  const rDis = await execTool('click_button', { target: 'next' })
  eq(rDis.ok, false, 'E3 disabled 的「次へ」点击失败')
  assert(/禁用|disabled/.test(rDis.result), 'E3b 明确提示「次へ」当前处于禁用状态，不要直接 finish', rDis.result)
  disBtnHolder.remove()

  // E4: 回归锁定——nextish 只认导航词。type=submit/primary 且文案不含导航词的最终提交按钮
  // （予約する/保存 等）不得被 findNavButton('next') 选中（曾有 submit/primary 兜底导致误点提交）
  const trapHolder = document.createElement('div')
  trapHolder.innerHTML = `
    <form><input type="text"><button type="submit" class="ant-btn ant-btn-primary" id="btn-trap-submit">予約する</button></form>
    <button type="button" class="ant-btn ant-btn-primary" id="btn-trap-save">保存</button>`
  document.body.appendChild(trapHolder)
  const navTrap = findNavButton('next')
  eq(navTrap.btn, null, 'E4 予約する/保存 等词表外提交按钮不被当作 next')
  trapHolder.remove()

  // ===== F. 全量优化回归（isSubmitLabel / actions 口径 / 富文本 / 多选 / lang）=====
  out.push('<div class="section">F. 提交判定与覆盖回归</div>')
  eq(isSubmitLabel('登録して次へ'), false, 'F1 「登録して次へ」导航优先→非提交')
  eq(isSubmitLabel('次 へ'), false, 'F2 含空格「次 へ」→非提交')
  eq(isSubmitLabel('確認画面へ'), false, 'F3 「確認画面へ」→非提交')
  eq(isSubmitLabel('登録する'), true, 'F4 「登録する」仍拦截')
  eq(isSubmitLabel('申込む'), true, 'F5 「申込む」仍拦截')
  eq(isSubmitLabel('送信'), true, 'F6 「送信」仍拦截')
  eq(isSubmitLabel('Submit'), true, 'F7 「Submit」仍拦截')
  // F7a-g: 归一化后无空格 → 多词英文词条必须连写；日文「申し込む」等高频提交词
  eq(isSubmitLabel('Place Order'), true, 'F7a 「Place Order」（去空格后匹配）→拦截')
  eq(isSubmitLabel('Sign Up'), true, 'F7b 「Sign Up」→拦截')
  eq(isSubmitLabel('Buy Now'), true, 'F7c 「Buy Now」→拦截')
  eq(isSubmitLabel('お申し込み'), true, 'F7d 「お申し込み」（申込中间有し）→拦截')
  eq(isSubmitLabel('確定する'), true, 'F7e 「確定する」→拦截')
  eq(isSubmitLabel('Apply'), true, 'F7f 整串等于「Apply」→拦截')
  eq(isSubmitLabel('Apply coupon'), false, 'F7g 「Apply coupon」非整串→不误拦')
  eq(isSubmitLabel('支払方法を変更'), false, 'F7h 「支払方法を変更」→不误拦')

  // F7i: 字段 ref 里藏着提交按钮（Form.Item 包 htmlType=submit）→ click 硬拦截
  const trap = document.createElement('div')
  trap.className = 'ant-form-item'
  trap.innerHTML = '<div class="ant-form-item-label"><label>送信トラップ</label></div><button type="submit">送信</button>'
  document.getElementById('main-form').appendChild(trap)
  const trapF = buildSnapshot().fields.find(f => f.label === '送信トラップ')
  const rTrap = trapF ? await execTool('click', { ref: trapF.ref }) : { ok: true }
  assert(!!trapF && rTrap.ok === false && /硬拦截/.test(rTrap.result), 'F7i click(ref) 命中提交按钮→硬拦截')
  trap.remove()

  // F7j: 控件直接挂在 <form> 下 → 单元是控件自身而非整个 form（否则 click 会摸到表单里的提交按钮）
  const form = document.getElementById('main-form')
  const bare = document.createElement('input')
  bare.setAttribute('aria-label', '裸フィールド')
  const bareSubmit = document.createElement('button')
  bareSubmit.type = 'submit'
  bareSubmit.textContent = '送信'
  form.append(bare, bareSubmit)
  let bareSubmitted = false
  const onBareSubmit = e => { bareSubmitted = true; e.preventDefault() }
  form.addEventListener('submit', onBareSubmit)
  const bareF = buildSnapshot().fields.find(f => f.label === '裸フィールド')
  const rBare = bareF ? await execTool('click', { ref: bareF.ref }) : { ok: false }
  assert(!!bareF && !bareSubmitted, 'F7j form 直接子控件的单元是控件自身（未把整个 form 当字段、未触发表单提交）')
  assert(!rBare.ok && /不是可点击元素/.test(rBare.result || ''), 'F7j2 对非可点单元 click 明确失败（不再静默假成功）', JSON.stringify(rBare))
  form.removeEventListener('submit', onBareSubmit)
  bare.remove(); bareSubmit.remove()

  // F8: lang 检测（runner.html 自带 lang=ja）

  const j3f = buildSnapshot().fields.find(f => f.kind === 'cards')
  const j3r = j3f ? await execTool('choose_option', { ref: j3f.ref, option: 'スタンダード' }) : { ok: false, result: 'no cards field' }
  assert(!!j3f && j3r.ok === false && /硬拦截/.test(j3r.result || ''), 'J3 表单内 default-submit 卡片被硬拦截', JSON.stringify(j3r))
  j3.remove()

  // J3b: 普通 div 卡片仍可正常选择（守卫不误伤）
  const j4 = document.createElement('div')
  j4.setAttribute('role', 'radiogroup')
  j4.innerHTML = '<div role="radio" aria-checked="false">ベーシック</div><div role="radio" aria-checked="false">プロ</div>'
  j4.querySelectorAll('[role="radio"]').forEach(c => c.addEventListener('click', () => c.setAttribute('aria-checked', 'true')))
  mainForm.appendChild(j4)
  const j4f = buildSnapshot().fields.find(f => f.kind === 'cards' && (f.options || []).includes('ベーシック'))
  const j4r = j4f ? await execTool('choose_option', { ref: j4f.ref, option: 'ベーシック' }) : { ok: false, result: 'no cards field' }
  assert(!!j4f && j4r.ok === true, 'J3b 普通 div 卡片正常选择', JSON.stringify(j4r))
  j4.remove()

  // J4: 地址组（.ant-select + 平铺 input）必须拆成多个单元，空的必填子字段要进 missingRequired
  const j5 = document.createElement('div')
  j5.className = 'ant-form-item'
  j5.innerHTML = '<div class="ant-form-item-label"><label class="ant-form-item-required">住所</label></div>'
    + '<input placeholder="郵便番号"><div class="ant-select"><div class="ant-select-selector"><span class="ant-select-selection-item">東京都</span></div></div><input placeholder="市区町村">'
  mainForm.appendChild(j5)
  const j5snap = buildSnapshot()
  const j5zip = j5snap.fields.find(f => f.label === '郵便番号')
  const j5city = j5snap.fields.find(f => f.label === '市区町村')
  assert(!!j5zip && !!j5city, 'J4a 地址组两个平铺输入框各自建 ref（不再只认领第一个）', JSON.stringify(j5snap.fields.filter(f => /郵便|市区/.test(f.label || '')).map(f => f.label)))
  assert(j5snap.missingRequired.some(x => x.includes('郵便番号')) && j5snap.missingRequired.some(x => x.includes('市区町村')), 'J4b 空的必填子字段进入 missingRequired', JSON.stringify(j5snap.missingRequired))
  j5.remove()

  // J5: 合并 checkbox 组 —— 必填成员未勾选不得被同组其它已勾选成员掩盖
  const j6 = document.createElement('div')
  j6.className = 'ant-form-item'
  j6.innerHTML = '<div class="ant-form-item-label"><label>同意</label></div><label><input type="checkbox" required> 同意する</label><label><input type="checkbox" checked> メルマガ</label>'
  mainForm.appendChild(j6)
  const j6snap = buildSnapshot()
  const j6f = j6snap.fields.find(f => f.kind === 'checkbox' && f.label === '同意')
  assert(!!j6f && j6f.filled === false, 'J5 必填成员未勾选 → filled=false', JSON.stringify(j6f))
  assert(j6snap.missingRequired.some(x => x.includes('同意')), 'J5b 该组进入 missingRequired', JSON.stringify(j6snap.missingRequired))
  j6.remove()

  // J6: 包裹层内的裸 [role=switch]（无 .ant-switch class）不得被判 unknown 丢弃
  const j7 = document.createElement('div')
  j7.innerHTML = '<span>通知設定</span><button type="button" role="switch" aria-checked="false">通知</button>'
  mainForm.appendChild(j7)
  const j7snap = buildSnapshot()
  assert(j7snap.fields.some(f => f.kind === 'switch' && f.value === 'off'), 'J6 包裹层内裸 [role=switch] 被识别为 switch', JSON.stringify(j7snap.fields.filter(f => f.kind === 'switch')))
  j7.remove()

  // J7: display:none 幽灵 input 不得遮蔽可见 input（快照读值 + fill 落点都要在可见的那个）
  const j8 = document.createElement('div')
  j8.className = 'ant-form-item'
  j8.innerHTML = '<input style="display:none" required><input value="既存値">'
  mainForm.appendChild(j8)
  const j8in = j8.querySelectorAll('input')[1]
  const j8f = buildSnapshot().fields.find(f => f.value === '既存値')
  assert(!!j8f && j8f.filled === true, 'J7a 快照读到可见 input 的值（不被 display:none 遮蔽）')
  const j8r = j8f ? await execTool('fill_text', { ref: j8f.ref, value: 'テスト太郎' }) : { ok: false, result: 'no field' }
  eq(j8in.value, 'テスト太郎', 'J7b fill 落到可见 input')
  eq(j8.querySelectorAll('input')[0].value, '', 'J7c 隐藏 input 未被写入')
  j8.remove()

  // J8: readonly 字段 fill_text 明确失败且不改写原值
  const j9 = document.createElement('div')
  j9.className = 'ant-form-item'
  j9.innerHTML = '<div class="ant-form-item-label"><label>ロック</label></div><input readonly value="固定">'
  mainForm.appendChild(j9)
  const j9in = j9.querySelector('input')
  const j9f = buildSnapshot().fields.find(f => f.label === 'ロック')
  const j9r = j9f ? await execTool('fill_text', { ref: j9f.ref, value: '999' }) : { ok: false, result: 'no field' }
  assert(j9r.ok === false && /readonly|只读/.test(j9r.result || ''), 'J8 readonly 字段 fill_text 明确失败', JSON.stringify(j9r))
  eq(j9in.value, '固定', 'J8b readonly 原值未被改写')
  j9.remove()

  // ===== K. 第二批修复回归（可见性 / readonly 确认页 / actions 截断 / 选项口径）=====
  out.push('<div class="section">K. 第二批修复回归</div>')
  const byUnit = (root, pred) => buildSnapshot().fields.find(f => { const r = getRef(f.ref); return pred(f) && r && root.contains(r.item) })

  // K1: visibility:hidden 的错误节点不算校验错误；visible() 本身排除 visibility:hidden
  const k1style = document.createElement('style')
  k1style.textContent = '.k1-hidden-vis{visibility:hidden}'
  document.head.appendChild(k1style)
  const k1 = document.createElement('div')
  k1.className = 'ant-form-item'
  k1.innerHTML = '<div class="ant-form-item-label"><label>隠れエラー</label></div><input><div class="ant-form-item-explain-error k1-hidden-vis">phantom</div>'
  mainForm.appendChild(k1)
  const k1f = byUnit(k1, f => f.kind === 'text')
  assert(!!k1f && !k1f.error, 'K1 visibility:hidden 错误节点不算校验错误', JSON.stringify(k1f))
  eq(visible(k1.querySelector('.k1-hidden-vis')), false, 'K1b visible() 排除 visibility:hidden')
  k1.remove()

  // K2: readonly 回显的确认页仍须被识别并硬拦截（iframe fixture：整页只有 readonly + 提交按钮）
  const k2 = await probe('fixtures-confirm-readonly.html', async w => {
    w.eval('(async () => { const v = { conf: isConfirm(), blocked: await execTool("click_button", { target: "next" }) }; window.__r = JSON.stringify(v) })()')
    return JSON.parse(await waitR(w))
  })
  eq(k2.conf, true, 'K2 readonly 回显的确认页被识别（不再漏判）')
  eq(k2.blocked.ok, false, 'K2b readonly 确认页 click_button 被硬拦截')

  // K3: actions 必须先过滤再截断——20 个隐藏按钮不得挤掉真正的「住所自動入力」
  const k3 = document.createElement('div')
  k3.innerHTML = Array.from({ length: 20 }, (_, i) => `<button type="button" style="display:none">hidden${i}</button>`).join('')
    + '<button type="button" id="k3-autofill">住所自動入力</button>'
  mainForm.appendChild(k3)
  const k3act = buildSnapshot().actions.find(a => /住所自動入力/.test(a.label))
  assert(!!k3act, 'K3 actions 先过滤后截断（隐藏按钮不挤掉住所自動入力）', JSON.stringify(buildSnapshot().actions.map(a => a.label)))
  k3.remove()

  // K4: 原生 select 的 first 跳过 disabled 选项
  const k4 = document.createElement('div')
  k4.className = 'ant-form-item'
  k4.innerHTML = '<div class="ant-form-item-label"><label>区分</label></div><select><option value="" disabled>選択してください</option><option value="a" disabled>区分A</option><option value="b">区分B</option></select>'
  mainForm.appendChild(k4)
  const k4f = byUnit(k4, f => f.kind === 'select')
  const k4r = k4f ? await execTool('choose_option', { ref: k4f.ref, option: 'first' }) : { ok: false, result: 'no field' }
  assert(k4r.ok === true && /区分B/.test(k4r.result || ''), 'K4 原生 select first 跳过 disabled 选项', JSON.stringify(k4r))
  k4.remove()

  // K5: 无响应的开关 toggle 必须明确失败（不再假报「已翻转」）
  const k5 = document.createElement('div')
  k5.innerHTML = '<button type="button" role="switch" aria-checked="false">無効スイッチ</button>'
  mainForm.appendChild(k5)
  const k5f = byUnit(k5, f => f.kind === 'switch')
  const k5r = k5f ? await execTool('choose_option', { ref: k5f.ref, option: 'toggle' }) : { ok: false, result: 'no field' }
  assert(k5r.ok === false, 'K5 无响应开关 toggle 明确失败', JSON.stringify(k5r))
  k5.remove()

  // K6: 无 value 属性的 checkbox 选项文本不应都变成 "on"
  const k6 = document.createElement('div')
  k6.className = 'ant-form-item'
  k6.innerHTML = '<div class="ant-form-item-label"><label>選択</label></div><input type="checkbox"><input type="checkbox" checked>'
  mainForm.appendChild(k6)
  const k6f = byUnit(k6, f => f.kind === 'checkbox')
  assert(!!k6f && (k6f.options || []).every(o => o.label !== 'on'), 'K6 无 value 的 checkbox 选项文本不再都是 "on"', JSON.stringify(k6f && k6f.options))
  k6.remove()

  const total = out.filter(x => x.startsWith('<div class="pass"')).length
  const fails = out.filter(x => x.startsWith('<div class="fail"')).length
  document.getElementById('summary').innerHTML = `<b>结果：PASS ${total} / FAIL ${fails}</b>`
  const payload = {
    pass: total, fail: fails,
    cases: cases.map(c => ({ ok: c.ok, name: c.name, detail: c.detail || '' })),
  }
  document.getElementById('results-json').textContent = JSON.stringify(payload)
  document.getElementById('results').innerHTML = out.join('\n')
  document.title = fails ? `runner-done:${fails}fail` : 'runner-done:allpass'
})().catch(e => {
  document.getElementById('results').innerHTML = '<div class="fail">RUNNER ERROR: ' + (e && e.message) + '</div><pre>' + (e && e.stack || '').replace(/</g, '&lt;') + '</pre>'
  document.getElementById('results-json').textContent = JSON.stringify({ status: 'error', message: e && e.message, stack: (e && e.stack || '').split('\n').slice(0, 6) })
  document.title = 'runner-error'
})
</script>
</body>
</html>
