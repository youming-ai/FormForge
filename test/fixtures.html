<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>fixtures: 全类型表单</title>
</head>
<body>
<header>
  <!-- 表单外的搜索框：不应进快照（pickScope 选控件最多的 form A） -->
  <input type="text" placeholder="サイト内検索" aria-label="サイト内検索">
</header>

<!-- Form A：控件最多的表单（pickScope 应选中它） -->
<form id="main-form">
  <!-- 1. label-for 结构 + required -->
  <div class="field">
    <label for="f-name">氏名</label>
    <input id="f-name" name="name" type="text" required>
  </div>

  <!-- 2. label 包裹结构（email） -->
  <div class="field">
    <label>メールアドレス<input id="f-email" name="email" type="email"></label>
  </div>

  <!-- 3. aria-label + placeholder（tel） -->
  <div class="field">
    <input id="f-tel" name="tel" type="tel" placeholder="電話番号" aria-label="電話番号">
  </div>

  <!-- 4. 原生日期 required -->
  <div class="field">
    <label for="f-birth">生年月日</label>
    <input id="f-birth" name="birth" type="date" required>
  </div>

  <!-- 5. 原生 select（options 静态可读） -->
  <div class="field">
    <label for="f-city">都道府県</label>
    <select id="f-city" name="city" required>
      <option value="">選択してください</option>
      <option value="tokyo">東京</option>
      <option value="osaka">大阪</option>
      <option value="fukuoka">福岡</option>
      <option value="sapporo">札幌</option>
    </select>
  </div>

  <!-- 6. radio 组（fieldset + 同 name + label 包裹） -->
  <fieldset id="f-pay-group">
    <legend>支払い方法</legend>
    <label><input type="radio" name="pay" value="card" checked>カード</label>
    <label><input type="radio" name="pay" value="bank">銀行振込</label>
    <label><input type="radio" name="pay" value="cod">代金引換</label>
  </fieldset>

  <!-- 7. checkbox 组（一个预选） -->
  <div class="field" id="f-opt-group">
    <label><input type="checkbox" name="opt1" checked>メール受け取り</label>
    <label><input type="checkbox" name="opt2">DM受け取り</label>
  </div>

  <!-- 8. textarea -->
  <div class="field">
    <label for="f-bio">自己紹介</label>
    <textarea id="f-bio" name="bio"></textarea>
  </div>

  <!-- 9. 文件上传 -->
  <div class="field">
    <label for="f-file">履歴書</label>
    <input id="f-file" name="file" type="file" accept="image/*">
  </div>

  <!-- 10. number -->
  <div class="field">
    <label for="f-qty">数量</label>
    <input id="f-qty" name="qty" type="number">
  </div>

  <!-- 11. password（input 但非 text 语义，仍应识别为 text 类控件） -->
  <div class="field">
    <label for="f-pass">パスワード</label>
    <input id="f-pass" name="pass" type="password">
  </div>

  <!-- 12. 应被跳过：hidden -->
  <input type="hidden" name="csrf" value="x" aria-label="隠しフィールド">

  <!-- 13. 应被跳过：disabled -->
  <div class="field">
    <label for="f-dis">無効項目</label>
    <input id="f-dis" name="dis" type="text" disabled>
  </div>
</form>

<!-- Form B：小表单（验证 pickScope 选 Form A 而不是它） -->
<form id="side-form">
  <label for="f-side">サイド入力</label>
  <input id="f-side" type="text">
</form>

<footer><p>フッター</p></footer>
</body>
</html>
