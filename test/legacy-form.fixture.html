<!DOCTYPE html>
<!-- 模拟 legacy ApplyForm/steps 的真实 DOM 结构，验证 snapshot 扫描逻辑。
     用法：chrome 打开此文件，控制台粘贴 snapshot.js 内容后调用 buildSnapshot()。
     或用 node + linkedom/jsdom 跑（见 scripts/test-snapshot.mjs）。 -->
<html>
<head><meta charset="utf-8"><title>legacy ApplyForm DOM 模拟</title></head>
<body>
  <div class="merchant-apply-info">
    <div class="merchant-apply-info__input__right">
      <div class="merchant-apply-info__title">契約内容</div>
      <div class="merchant-apply-info__content">
        <!-- ① ContractSelect 取引形態自定义卡片（isSupportBusinessSubtype 开启时） -->
        <form class="ant-form ant-form-vertical">
          <div class="ant-form-item ant-form-item-vertical">
            <div class="ant-form-item-label"><label class="ant-form-item-required" title="事業形態">事業形態</label></div>
            <div class="ant-form-item-control">
              <div>
                <button type="button" class="ant-btn ant-btn-link mb-2">選択のヒント</button>
                <!-- 卡片1：実店舗(offline) 选中态 -->
                <div class="default-select-business-type-item mb-2 cursor-pointer rounded-lg p-4 transition-all duration-200 bg-blue-50 active-select-business-type-item">
                  <div class="mb-4">
                    <p class="mb-2 font-bold text-gray-800">実店舗（対面）</p>
                    <p class="mb-4 text-sm text-gray-600">店舗での対面取引</p>
                  </div>
                  <div class="ant-form-item ant-form-item-vertical" style="margin-bottom:0">
                    <div class="ant-form-item-control">
                      <label class="ant-checkbox-wrapper"><span class="ant-checkbox"><input type="checkbox" class="ant-checkbox-input" checked></span><span class="text-sm text-gray-700">食品販売</span></label>
                      <label class="ant-checkbox-wrapper"><span class="ant-checkbox"><input type="checkbox" class="ant-checkbox-input"></span><span class="text-sm text-gray-700">物販</span></label>
                    </div>
                  </div>
                </div>
                <!-- 卡片2：online 未选 -->
                <div class="default-select-business-type-item mb-2 cursor-pointer rounded-lg p-4 transition-all duration-200 bg-gray-50">
                  <div class="mb-4">
                    <p class="mb-2 font-bold text-gray-800">ネットショップ</p>
                    <p class="mb-4 text-sm text-gray-600">ECサイト</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- ② 法人格：无 label 的两个 es-search-select（外层带 label） -->
          <div class="ant-form-item ant-form-item-vertical">
            <div class="ant-form-item-label"><label class="ant-form-item-required">法人格</label></div>
            <div class="ant-form-item-control">
              <div class="ant-row">
                <div class="ant-col">
                  <div class="ant-form-item ant-form-item-vertical">
                    <div class="ant-form-item-control">
                      <div class="es-search-select">
                        <div class="ant-select ant-select-single">
                          <div class="ant-select-selector"><span class="ant-select-selection-search"><input></span></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="ant-col">
                  <div class="ant-form-item ant-form-item-vertical">
                    <div class="ant-form-item-control">
                      <div class="es-search-select">
                        <div class="ant-select ant-select-single">
                          <div class="ant-select-selector"><span class="ant-select-selection-search"><input></span></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- ③ 法人番号 a-input-search（带纯图标搜索按钮） -->
          <div class="ant-form-item ant-form-item-vertical">
            <div class="ant-form-item-label"><label class="ant-form-item-required">法人番号</label></div>
            <div class="ant-form-item-control">
              <span class="ant-input-group ant-input-group-compact">
                <span class="ant-input-group-addon">7</span>
                <input class="ant-input" value="050001014860">
                <span class="ant-input-group-addon">
                  <button type="button" class="ant-btn ant-input-search-button"><span class="anticon anticon-search"></span></button>
                </span>
              </span>
            </div>
          </div>

          <!-- ④ 料金プラン legacy PlanSelect 卡片 -->
          <div class="ant-form-item ant-form-item-vertical">
            <div class="ant-form-item-label"><label class="ant-form-item-required">料金プラン</label></div>
            <div class="ant-form-item-control">
              <div class="plan-select grid grid-cols-3 gap-2">
                <div class="box-border flex min-h-[120px] flex-col rounded-lg border-2 border-solid p-4 transition-all duration-200 border-[#1890ff] bg-blue-50 cursor-pointer">
                  <div class="mb-3 font-bold text-gray-800">スタンダード</div>
                  <div class="billing-plan-item">月額 0 円</div>
                </div>
                <div class="box-border flex min-h-[120px] flex-col rounded-lg border-2 border-solid p-4 transition-all duration-200 border-[#f0f0f0] bg-gray-50 cursor-pointer">
                  <div class="mb-3 font-bold text-gray-800">プレミアム</div>
                </div>
              </div>
            </div>
          </div>

          <!-- ⑤ ZipInput 邮编 + 住所自動入力 按钮 -->
          <div class="ant-form-item ant-form-item-vertical">
            <div class="ant-form-item-label"><label class="ant-form-item-required">郵便番号</label></div>
            <div class="ant-form-item-control">
              <span class="ant-input-group ant-input-group-compact" style="display:flex">
                <input class="ant-input" value="150-0001" placeholder="150-0001">
                <button type="button" class="ant-btn">住所自動入力</button>
              </span>
            </div>
          </div>
        </form>

        <!-- ⑥ CheckButton（お店と同じ情報）：a + es-icon，不在 form-item 内 -->
        <div class="flex-both-wrapper"><span></span><span>
          <a style="color: inherit; cursor: pointer; line-height: 2"><span class="es-icon" aria-hidden="true"></span>お店と同じ情報を使用</a>
        </span></div>

        <!-- ⑦ FileUploader 自定义列表项 -->
        <div class="ant-form-item ant-form-item-vertical">
          <div class="ant-form-item-label"><label class="ant-form-item-required">店舗外観写真</label></div>
          <div class="ant-form-item-control">
            <span class="ant-upload">
              <input type="file" style="display:none">
              <button type="button" class="ant-btn"><span>アップロード</span></button>
            </span>
            <div class="ant-upload-list ant-upload-list-picture-card">
              <div class="file-downloader-item">
                <div class="file-downloader-item__info"><div class="file-downloader-item__name"><span title="test.png">test.png</span></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="merchant-apply-info__action">
        <button type="button" class="ant-btn ant-btn-default">戻る</button>
        <button type="button" class="ant-btn ant-btn-primary">次へ</button>
      </div>
    </div>
  </div>
</body>
</html>
